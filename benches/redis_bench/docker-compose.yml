name: pd_redis_bench

# Dedicated, ephemeral Redis for the Redis bench. Independent of anything on
# the host.
#
# Host port (overridable):
#   PD_REDIS_PORT (default 6390) -> Redis
#
# Redis runs with no persistence (--save '' --appendonly no), so every fresh
# container starts from a clean slate.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${PD_REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
