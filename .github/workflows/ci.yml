name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported pair (matches the mix.exs requirement)
          - elixir: "1.17"
            otp: "27"
          # Latest verified pair (matches .tool-versions)
          - elixir: "1.20"
            otp: "27"
            lint: true
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - if: matrix.lint
        run: mix format --check-formatted

      # Non-blocking for now: credo surfaces style/refactoring signal but the
      # backlog is large (see action plan); not a v0.1 gate.
      - if: matrix.lint
        run: mix credo --strict
        continue-on-error: true

      - run: mix test

  package:
    name: Hex package contents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - run: mix deps.get

      - run: ./scripts/check_package_contents.sh

  bench:
    name: Bench (${{ matrix.bench }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bench: [cachex_bench]
    defaults:
      run:
        working-directory: benches/${{ matrix.bench }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            benches/${{ matrix.bench }}/deps
            benches/${{ matrix.bench }}/_build
          key: bench-${{ matrix.bench }}-${{ hashFiles(format('benches/{0}/mix.lock', matrix.bench)) }}
          restore-keys: bench-${{ matrix.bench }}-

      - run: mix deps.get

      - run: mix test
