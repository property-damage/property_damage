name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run on the default branch: a toolchain or runner image change
  # then fails here before it fails a pull request.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported pair (matches the mix.exs requirement)
          - elixir: "1.17"
            otp: "27"
          # Latest verified pair (matches .tool-versions)
          - elixir: "1.20"
            otp: "27"
            lint: true
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      # The dev compile skips test/support, so compile the test environment too.
      - run: MIX_ENV=test mix compile --warnings-as-errors

      - if: matrix.lint
        run: mix format --check-formatted

      # Blocking: the codebase is credo-strict clean. Structural-complexity
      # checks (Nesting/CyclomaticComplexity/FunctionArity) are disabled in
      # .credo.exs with rationale; everything else is enforced.
      - if: matrix.lint
        run: mix credo --strict

      # The count of module dependency cycles may never rise. A change
      # that removes cycles lowers the number in the same change.
      - if: matrix.lint
        run: mix xref graph --format cycles --fail-above 4

      - run: mix test

  # Runs the documentation gate (every runnable fence, in a consumer project
  # that depends on this checkout) and checks that each failure-report excerpt
  # in the guides still matches a fresh run. Both scripts read every guide and
  # skip the ones without markers.
  docs:
    name: Documentation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          # The verified toolchain pair (.tool-versions / lint entry above).
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-1.20-27-${{ hashFiles('mix.lock') }}
          restore-keys: mix-1.20-27-

      - run: mix deps.get

      - name: Documentation-verification gate (runnable fences + notebook)
        run: elixir scripts/docs_verify.exs

      - name: Report excerpts match a fresh run
        run: elixir scripts/regen_report_excerpts.exs --check

  # Opens real failure pages in Chromium over file:// (test/browser): the tabs,
  # the citations of an explanation and the index page. The pages come from
  # small models run through the framework, so the viewer is checked against
  # what the framework writes.
  browser:
    name: Viewer browser specs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          # The same pair as the documentation gate.
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-1.20-27-${{ hashFiles('mix.lock') }}
          restore-keys: mix-1.20-27-

      - run: mix deps.get

      - name: Generate the failure pages
        run: mix run test/browser/generate_pages.exs "$RUNNER_TEMP/pd_pages"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the specs' dependencies
        working-directory: test/browser
        run: npm ci

      - name: Install Playwright Chromium (with OS deps)
        working-directory: test/browser
        run: npx playwright install --with-deps chromium

      - name: Run the specs
        working-directory: test/browser
        env:
          PD_PAGES_DIR: ${{ runner.temp }}/pd_pages
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: test/browser/playwright-report/
          retention-days: 7

  package:
    name: Hex package contents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - run: mix deps.get

      - run: ./scripts/check_package_contents.sh

  # Zero-infra benches: in-process SUTs, no service containers needed.
  bench:
    name: Bench (${{ matrix.bench }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - bench: cachex_bench
            models: CachexBench.Model
          - bench: openapi_bench
            models: OpenapiBench.Generated.Model OpenapiBench.Idempotency.Model
    defaults:
      run:
        working-directory: benches/${{ matrix.bench }}
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v5
        with:
          path: |
            benches/${{ matrix.bench }}/deps
            benches/${{ matrix.bench }}/_build
          key: bench-${{ matrix.bench }}-${{ hashFiles(format('benches/{0}/mix.lock', matrix.bench)) }}
          restore-keys: bench-${{ matrix.bench }}-

      - run: mix deps.get

      - run: mix format --check-formatted

      # Determinism audit: generation must be a pure function of the seed
      # (feature 3). Needs no service container.
      - name: Audit generation determinism
        run: for model in ${{ matrix.models }}; do mix pd.audit "$model"; done

      - run: mix test

  # Oban bench needs a real Postgres. Setting PD_OBAN_DATABASE_URL makes the
  # bench's mix alias skip its local docker-compose and use this service
  # container instead (it still runs ecto.create + ecto.migrate before the test).
  bench_oban:
    name: Bench (oban_bench)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pd_oban_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pd_oban_bench"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PD_OBAN_DATABASE_URL: ecto://postgres:postgres@localhost:5432/pd_oban_bench
    defaults:
      run:
        working-directory: benches/oban_bench
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v5
        with:
          path: |
            benches/oban_bench/deps
            benches/oban_bench/_build
          key: bench-oban_bench-${{ hashFiles('benches/oban_bench/mix.lock') }}
          restore-keys: bench-oban_bench-

      - run: mix deps.get

      - run: mix format --check-formatted

      # Determinism audit (feature 3): generation-only, needs no Postgres.
      - name: Audit generation determinism
        run: |
          for model in ObanBench.Model ObanBench.Retry.Model ObanBench.Uniqueness.Model ObanBench.Compare.Model ObanBench.Compare.ReadModel; do
            mix pd.audit "$model"
          done

      - run: mix test

  # Redis bench needs Redis. PD_REDIS_URL makes the bench's mix alias skip its
  # local docker-compose and points the bench at the redis service container,
  # published to the runner at localhost:6379.
  bench_redis:
    name: Bench (redis_bench)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PD_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: benches/redis_bench
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v5
        with:
          path: |
            benches/redis_bench/deps
            benches/redis_bench/_build
          key: bench-redis_bench-${{ hashFiles('benches/redis_bench/mix.lock') }}
          restore-keys: bench-redis_bench-

      - run: mix deps.get

      - run: mix format --check-formatted

      # Determinism audit (feature 3): generation-only, needs no Redis.
      - name: Audit generation determinism
        run: |
          for model in RedisBench.Model; do
            mix pd.audit "$model"
          done

      - run: mix test

  # Gitea bench drives the SAME model against two transports (REST API and a
  # Playwright-driven UI) and compares them through the model's @compare
  # observations (the forge state and the label colors).
  # Unlike the other benches it is not run against service containers: it needs
  # two coordinated Gitea instances each with a bootstrapped admin, which its own
  # docker-compose + bench.db.up already provision (GitHub runners ship Docker
  # Compose v2). So the job just runs the bench as-is; the only extra setup is
  # Node and the Chromium browser (with OS deps) the UI adapter drives.
  bench_gitea:
    name: Bench (gitea_bench)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: benches/gitea_bench
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/cache@v5
        with:
          path: |
            benches/gitea_bench/deps
            benches/gitea_bench/_build
          key: bench-gitea_bench-${{ hashFiles('benches/gitea_bench/mix.lock') }}
          restore-keys: bench-gitea_bench-

      - run: mix deps.get

      - run: mix format --check-formatted

      # Install the Chromium the UI adapter drives, with its OS dependencies
      # (the runner has passwordless sudo). Uses the driver bundled with the
      # `playwright` hex package, so the browser revision matches. This makes the
      # `playwright.install` step in the bench's `test` alias a no-op.
      - name: Install Playwright Chromium (with OS deps)
        run: node deps/playwright/priv/static/driver.js install --with-deps chromium

      # Determinism audit (feature 3): generation-only, needs no Gitea/browser.
      - name: Audit generation determinism
        run: |
          for model in GiteaBench.Model GiteaBench.WebhookModel; do
            mix pd.audit "$model"
          done

      - run: mix test

  # Kratos bench validates the MockServiceAdapter: a single Ory Kratos container
  # (in-memory DSN, no DB sidecar) whose registration web_hook calls the mock the
  # bench serves on the host. Like gitea it is not run against a service container
  # (it needs the config mount + host-gateway back-channel), so the job just runs
  # the bench as-is; its own docker-compose + bench.db.up provision Kratos
  # (GitHub runners ship Docker Compose v2 and support host-gateway).
  bench_kratos:
    name: Bench (kratos_bench)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: benches/kratos_bench
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v5
        with:
          path: |
            benches/kratos_bench/deps
            benches/kratos_bench/_build
          key: bench-kratos_bench-${{ hashFiles('benches/kratos_bench/mix.lock') }}
          restore-keys: bench-kratos_bench-

      - run: mix deps.get

      - run: mix format --check-formatted

      # Determinism audit (feature 3): generation-only, needs no Kratos.
      - name: Audit generation determinism
        run: mix pd.audit KratosBench.Model

      - run: mix test
