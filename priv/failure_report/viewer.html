<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PD_TITLE__</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f23; --muted: #5d636e; --line: #dfe1e5;
  --accent: #2f5bd3; --bad: #c62f2f; --bad-bg: #fdecec; --ok: #1f7a4a; --ok-bg: #e7f5ee;
  --warn: #8a5a00; --ref: #2f5bd3; --var: #8d3fc7; --code-bg: #f0f1f3;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1d2026; --ink: #e6e8ec; --muted: #9aa1ad; --line: #30343c;
    --accent: #7ea2ff; --bad: #ff7b7b; --bad-bg: #3a1f22; --ok: #6fd3a0; --ok-bg: #18322a;
    --warn: #e0b45c; --ref: #7ea2ff; --var: #c79bff; --code-bg: #262a31;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1d2026; --ink: #e6e8ec; --muted: #9aa1ad; --line: #30343c;
  --accent: #7ea2ff; --bad: #ff7b7b; --bad-bg: #3a1f22; --ok: #6fd3a0; --ok-bg: #18322a;
  --warn: #e0b45c; --ref: #7ea2ff; --var: #c79bff; --code-bg: #262a31;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 80px; }
.stateline { font: 12px var(--mono); color: var(--muted); padding: 8px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
header.top { padding: 14px 0 6px; }
h1 { font-size: 20px; margin: 4px 0 6px; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 14px; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0 16px; }
nav.tabs a { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; font-size: 13px; background: var(--panel); }
nav.tabs a.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
code, .mono { font-family: var(--mono); font-size: 13px; }
code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; word-break: break-word; }
a { color: var(--accent); }
.tag-ann { display: inline-block; font: 10px var(--mono); color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: middle; white-space: nowrap; }
.tgt-ref { color: var(--ref); font-weight: 600; }
.tgt-var { color: var(--var); font-weight: 600; }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
button { font: 13px var(--sans); padding: 5px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.btnrow { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; align-items: center; }
.scroll { overflow-x: auto; max-width: 100%; }
pre { margin: 0; }
pre.code { font: 12px/1.45 var(--mono); background: var(--code-bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; max-width: 100%; }
pre.wrapcode { white-space: pre-wrap; word-break: break-all; }

/* explore */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.chip { font: 12px var(--mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--ink); }
.chip .c { color: var(--muted); margin-left: 4px; }
.chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip:not(.on) { opacity: .55; text-decoration: line-through; }
.tn { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; min-width: 0; }
.tn:hover { background: var(--code-bg); }
.tn .tw { width: 14px; flex: none; color: var(--muted); text-align: center; }
.tn .lb { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tn .bd { flex: none; font-size: 10.5px; padding: 0 5px; border-radius: 999px; background: var(--code-bg); color: var(--warn); border: 1px solid var(--line); }
.tn .tm { flex: none; color: var(--muted); font-size: 11px; }
.tn.fail .lb { color: var(--bad); }
.tn.k-target.ref .lb { color: var(--ref); font-weight: 700; }
.tn.k-target.var .lb { color: var(--var); font-weight: 700; }
.tn.k-event .lb { color: var(--ok); }
.tn.k-log .lb { color: var(--muted); }
.tn.sel { background: var(--accent); }
.tn.sel .lb, .tn.sel .tm, .tn.sel .tw { color: var(--bg) !important; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.crumbs { font: 12px var(--mono); color: var(--muted); margin-bottom: 8px; word-break: break-word; }
.crumbs a { cursor: pointer; text-decoration: none; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 10px 0; flex-wrap: wrap; }
.subtabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); }
.subtabs button.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.strip { display: flex; gap: 3px; flex-wrap: wrap; margin: 8px 0 4px; }
.cell { width: 30px; height: 30px; border-radius: 5px; border: 1px solid var(--line); font: 11px var(--mono); display: grid; place-items: center; cursor: pointer; color: var(--ink); padding: 0; }
.cell.ph-pend-0 { background: color-mix(in srgb, var(--warn) 18%, var(--panel)); }
.cell.ph-pend-1 { background: color-mix(in srgb, var(--warn) 36%, var(--panel)); }
.cell.ph-pend-2 { background: color-mix(in srgb, var(--warn) 58%, var(--panel)); }
.cell.ph-done { background: color-mix(in srgb, var(--ok) 45%, var(--panel)); }
.cell.edge { border-color: var(--ink); border-width: 2px; }
.cell.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
.diff { font: 12px/1.5 var(--mono); background: var(--code-bg); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.diff .a { color: var(--ok); }
.diff .r { color: var(--bad); }
.diff .m { color: var(--warn); }
.rawlog { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.rl { display: grid; grid-template-columns: 52px 110px minmax(0, 1fr); gap: 6px; font: 12px var(--mono); padding: 2px 4px; border-radius: 4px; cursor: pointer; }
.rl:hover { background: var(--code-bg); }
.rl .tg { color: var(--accent); }
.rl .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rl.open .tx { white-space: pre-wrap; word-break: break-all; }
.empty { color: var(--muted); font-style: italic; font-size: 13px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
.blk { font: 600 12px var(--mono); color: var(--muted); margin: 8px 0 3px; }
.jbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 2px 0 4px; }
.jbar button { font: 11px var(--mono); padding: 1px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); cursor: pointer; }
.jbar button.on { color: var(--accent); border-color: var(--accent); }
.jbar .jsep { font-size: 11px; color: var(--muted); margin-left: 8px; }
.ftree { font: 12px/1.5 var(--mono); background: var(--panel); border-radius: 6px; padding: 6px 10px 6px 1.6em; max-height: 420px; overflow: auto; }
.ftree .fa { position: relative; display: inline-block; width: 0; }
.ftree .fa .ftog { position: absolute; right: 0.15em; top: -1.1em; height: 1.5em; }
.ftree .fl { display: flex; align-items: flex-start; }
.ftree .ft { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.ftree .ft:empty::before { content: "\200b"; }
.ftree .fsum { color: var(--muted); white-space: pre; user-select: none; }
.ftree .fn.closed > .fc, .ftree .fn:not(.closed) > .fl .fsum { display: none; }
.ftog { width: 1.3em; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; text-align: center; user-select: none; }
.ftog:hover { color: var(--accent); }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--code-bg); }

/* reproduce */
.snip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.snip .sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.copied { color: var(--ok); font-size: 12px; }

@media (max-width: 640px) {
  h1 { font-size: 18px; }
  .rl { grid-template-columns: 44px minmax(0, 1fr); }
  .rl .tg { display: none; }
}

/* I: report-only run */
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.t th, table.t td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; font-family: var(--mono); }
table.t th { font-size: 11.5px; color: var(--muted); font-weight: 600; font-family: var(--sans); }
table.t td.flag { color: var(--bad); font-weight: 700; }
.projtbl td.chg { color: var(--bad); font-weight: 600; }
.wrap { max-width: none; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 14px; font: 12.5px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.facts .k { color: var(--muted); }
.facts .v { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.rgrid { display: grid; gap: 8px 12px; align-items: start; }
.rgrid .hd { font-size: 13px; font-weight: 600; padding-bottom: 4px; border-bottom: 3px solid var(--line); min-width: 0; }
.rgrid .hd.c0 { border-color: var(--ref); }
.rgrid .hd.c1 { border-color: var(--var); }
.c0 .tname, .tname.c0 { color: var(--ref); font-weight: 600; }
.c1 .tname, .tname.c1 { color: var(--var); font-weight: 600; }
.cmpwrap { grid-column: 1 / -1; min-width: 0; }
details.cmp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; margin: 0 0 4px; }
details.cmp summary { cursor: pointer; font: 600 13px var(--sans); }
details.cmp summary .sub { font-weight: 400; font-size: 12px; }
.crow { margin-top: 8px; border-left: 3px solid transparent; padding-left: 8px; }
.crow.on { border-left-color: var(--accent); }
.crow .ch { font: 12.5px var(--mono); margin-bottom: 2px; }
table.t th.own, table.t td.own { background: var(--code-bg); }
.rband { grid-column: 1 / -1; font: 12.5px var(--mono); color: var(--muted); padding: 12px 0 0; border-top: 1px dashed var(--line); min-width: 0; }
.rband .rh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.rband b { color: var(--ink); overflow-wrap: anywhere; }
.rband.mark b, .rband.mark .mk { color: var(--bad); }
.rband .facts { margin: 6px 0 0; border-color: var(--bad); }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; border: 0; padding: 0; }
.ebox { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); min-width: 0; }
.ebox.mark { border-color: var(--bad); }
.ebox .lh { font: 12.5px var(--mono); font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; }
.ebox .ls { font-size: 12px; color: var(--muted); margin: 2px 0 2px; }
.setupbox { grid-column: 1 / -1; }
.steps { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.st { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 12px 56px minmax(40px, max-content) minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 5px; font: 12.5px var(--mono); cursor: pointer; border: 1px solid transparent; min-width: 0; }
.st:hover { background: var(--code-bg); }
.st:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.st .cv { color: var(--muted); font-size: 10px; }
.st .tt { color: var(--muted); }
.st .kd { font-size: 10.5px; color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .lb .chipv { color: var(--muted); }
.st .bd { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--code-bg); color: var(--warn); white-space: nowrap; }
.st.k-event .lb { font-weight: 600; }
.st.k-omitted { cursor: default; font-style: italic; color: var(--muted); }
.st.hot .lb { color: var(--bad); }
.st.open { background: var(--code-bg); border-radius: 5px 5px 0 0; }
.st.sel { border-color: var(--accent); }
.st.cp { border: 1px dashed var(--accent); }
.det { margin: 0 0 8px 0; padding: 8px 10px 10px 18px; border-left: 3px solid var(--accent); background: var(--code-bg); border-radius: 0 0 6px 6px; min-width: 0; font-size: 13px; }
.det pre.code { max-height: 420px; overflow: auto; background: var(--panel); }
.det .scroll { background: var(--panel); max-height: 420px; overflow: auto; }
.det .kv { background: var(--panel); padding: 6px 8px; border-radius: 6px; }
.cpbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; margin: 0 0 8px; padding: 5px 8px; background: var(--panel); border-radius: 6px; }
.cpbar a { cursor: pointer; }
.cell.ph0 { background: var(--panel); }
.cell.ph1 { background: color-mix(in srgb, var(--accent) 16%, var(--panel)); }
.cell.ph2 { background: color-mix(in srgb, var(--accent) 32%, var(--panel)); }
.cell.ph3 { background: color-mix(in srgb, var(--accent) 48%, var(--panel)); }
.cell.gap { cursor: default; width: auto; padding: 0 6px; border-style: dashed; color: var(--muted); background: transparent; }
.runbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; margin: 6px 0 0; }
.runhint { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.nocp { font-size: 12px; color: var(--muted); font-style: italic; }
.projmod { margin-bottom: 10px; }
.projmod h4 { margin: 0 0 4px; font: 600 12.5px var(--mono); overflow-wrap: anywhere; }
.projtbl tr.same td { color: var(--muted); }
details.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
details.sec > summary { cursor: pointer; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.err { color: var(--bad); font-size: 13px; }
@media (max-width: 760px) {
  .rgrid { grid-template-columns: minmax(0, 1fr) !important; }
  .rgrid .hd { display: none; }
  .col::before { content: attr(data-t); font-size: 12px; font-weight: 600; }
  .col.c0::before { color: var(--ref); }
  .col.c1::before { color: var(--var); }
  .st { grid-template-columns: 10px 46px minmax(0, 1fr) auto; }
  .st .kd { display: none; }
  .det { padding-left: 10px; }
}
/* explanation: present only on a page that carries one */
.xtabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 4px 0 14px; }
.xtabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); font-size: 14px; }
.xtabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.xpane { max-width: 860px; min-width: 0; line-height: 1.55; }
.xlead { border: 1px dashed var(--warn); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 0 0 14px; }
.xpane h2 { margin: 20px 0 6px; }
.xpane p { margin: 4px 0; overflow-wrap: anywhere; }
.xpane li { overflow-wrap: anywhere; }
.xitem { margin: 0 0 12px; min-width: 0; }
.xhyp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; min-width: 0; }
.xhyp h3 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
.xhyp ul { margin: 2px 0 4px; padding-left: 20px; }
.xlbl { font-size: 13px; font-weight: 600; margin-top: 8px; }
.xcites { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; margin-top: 4px; min-width: 0; }
.xcite { font: 11.5px var(--mono); color: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; text-align: left; max-width: 100%; overflow-wrap: anywhere; }
.xcite.xnone { color: var(--muted); border-style: dashed; }
.xcode { flex-basis: 100%; min-width: 0; max-width: 100%; overflow-x: auto; font: 12px/1.45 var(--mono); background: var(--code-bg); border-radius: 6px; padding: 6px 0; }
.xcode .xl { display: flex; white-space: pre; }
.xcode .xn { flex: none; width: 4.5em; padding-right: 10px; text-align: right; color: var(--muted); user-select: none; }
.xcode .xt { padding-right: 10px; }
.xhl { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stateline"><span id="stateline"></span><span><button id="theme" type="button" style="font-size:11px;padding:1px 8px">theme</button></span></div>
  <header class="top">
    <div class="sub mono" id="kicker"></div>
    <h1 id="headline"></h1>
  </header>
  <main id="view"><p class="sub">Loading…</p></main>
</div>
<script type="application/json" id="pd-report">__PD_REPORT_JSON__</script>
<script type="application/json" id="pd-bundle">__PD_BUNDLE_JSON__</script>
<script>
(function () {
  "use strict";
  // Everything below is derived from the report text alone. The page knows the layout
  // PropertyDamage prints (sections, step lines, timed log and event entries, the
  // "... N omitted" marker) and nothing about the system under test, its domain or protocol.
  var DOT = " · ";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmtT(t) { return t == null ? "" : "+" + Number(t).toFixed(2) + "s"; }

  // ---------- parsing ----------
  function splitTop(body) {
    var out = [], depth = 0, cur = "", inStr = false;
    for (var i = 0; i < body.length; i++) {
      var ch = body[i];
      if (inStr) { cur += ch; if (ch === "\\") { cur += body[++i] || ""; } else if (ch === '"') inStr = false; continue; }
      if (ch === '"') { inStr = true; cur += ch; continue; }
      if ("([{".indexOf(ch) >= 0) depth++;
      if (")]}".indexOf(ch) >= 0) depth--;
      if (ch === "," && depth === 0) { out.push(cur); cur = ""; continue; }
      cur += ch;
    }
    if (cur.trim()) out.push(cur);
    return out;
  }
  // An inspected struct: %Module{key: value, ...}. Returns null for anything else.
  function parseStruct(s) {
    var m = /^%([A-Za-z0-9_.]+)\{([\s\S]*)\}\s*$/.exec(String(s).trim());
    if (!m) return null;
    var fields = [];
    splitTop(m[2]).forEach(function (p) {
      var f = /^\s*([a-z_][A-Za-z0-9_?!]*): ([\s\S]*)$/.exec(p);
      if (f) fields.push([f[1], f[2].replace(/\s*\n\s*/g, " ").trim()]);
    });
    return { module: m[1], fields: fields };
  }
  function balanced(s) {
    var d = 0, inStr = false;
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (inStr) { if (ch === "\\") i++; else if (ch === '"') inStr = false; continue; }
      if (ch === '"') inStr = true; else if ("([{".indexOf(ch) >= 0) d++; else if (")]}".indexOf(ch) >= 0) d--;
    }
    return d <= 0;
  }
  function leadingSpaces(l) { return l.length - l.replace(/^ +/, "").length; }

  // A timed entry: `log`, `event` for a command's event, or the three-letter badge of another
  // event source (POL for a resource poller, INJ for an injector, ??? for an unknown one).
  // The note the renderer prints above the lines the adapter's setup/1 logged.
  var ADAPTER_SETUP_NOTE = "adapter setup/1";
  var ENTRY = /^( +)\+(\d+(?:\.\d+)?)s (log|event|[A-Z]{3}|\?\?\?)( +)(.*)$/;

  // Walks the lines of a block that holds steps and timed entries (Minimal Reproduction, Setup).
  function parseSteps(lines) {
    var targets = [], T = null, root = null, step = null, entry = null, pendingCmd = null, captions = [], blanks = 0, adapterNote = null;
    function ensureT() { if (!T) { T = { name: null, role: "only", steps: [] }; targets.push(T); } return T; }
    function ensureStep() {
      if (!step) { step = { label: "", depth: 0, cmd: "", marker: null, as: null, entries: [], children: [], pseudo: true, title: adapterNote }; adapterNote = null; ensureT().steps.push(step); root = step; }
      return step;
    }

    var lines = String(text).split("\n"), plan = foldPlan(lines), heads = Object.keys(plan.ends).map(Number);
    if (!heads.length) return verbatim(text);
    var ps = S.pay[pk] || (S.pay[pk] = { level: Infinity, fold: {} });
    var maxD = Math.max.apply(null, heads.map(function (i) { return plan.depth[i]; })) + 1;

      range(1, Math.min(maxD, 4)).map(function (d) { return '<button type="button" data-jact="lv" data-lv="' + d + '" class="' + (clean && ps.level === d ? "on" : "") + '">level ' + d + "</button>"; }).join("") +

    var n = NODES[id], cps = S.linked && n.ti != null ? others(n.ti).map(function (tj) { return counterpart(id, tj); }).filter(Boolean) : [];
    if (S.open[id]) { delete S.open[id]; cps.forEach(function (c) { delete S.open[c]; }); }
    else { S.open[id] = {}; cps.forEach(function (c) { if (!S.open[c]) S.open[c] = {}; }); }
    S.sel = id; setHash(); render(); focusStep(id);
  }
  function openStep(id) {
    if (!NODES[id]) return;
    if (!S.open[id]) S.open[id] = {};
    S.sel = id; setHash(); render(); focusStep(id, true);
  }
  function focusStep(id, scroll) {
    var b = view.querySelector('.st[data-id="' + CSS.escape(id) + '"]');
    if (!b) return;
    b.focus({ preventScroll: true });
    var r = b.getBoundingClientRect();
    if (scroll || r.top < 0 || r.bottom > window.innerHeight) b.scrollIntoView({ block: "start" });
  }
  function paintSel() {
    paintRow();
    view.querySelectorAll(".st.sel, .st.cp").forEach(function (x) { x.classList.remove("sel", "cp"); });
    if (!S.sel || !NODES[S.sel]) return;
    var b = view.querySelector('.st[data-id="' + CSS.escape(S.sel) + '"]'); if (b) b.classList.add("sel");
    var n = NODES[S.sel];
    if (n.ti != null) others(n.ti).forEach(function (tj) { var c = counterpart(S.sel, tj); var cb = c && view.querySelector('.st[data-id="' + CSS.escape(c) + '"]'); if (cb) cb.classList.add("cp"); });
  }
  // Up and Down walk one target's lines through setup and every step; Left and Right move to
  // the same line in the neighboring target. Keys act only when a line (or nothing) has focus,
  // so the controls inside an unfolded detail keep their own keyboard behavior.
  function walkList(ti) {
    var sel = '.setupbox .st:not([disabled]), .col[data-col="' + ti + '"] .st:not([disabled])';
    return Array.prototype.map.call(view.querySelectorAll(sel), function (b) { return b.getAttribute("data-id"); });
  }
  function blockOf(id) { var b = view.querySelector('.st[data-id="' + CSS.escape(id) + '"]'); return b && b.closest(".col, .setupbox"); }
  // On entering another step, bring its header into view with the line.
  function revealBlock(id) {
    var blk = blockOf(id), head = blk && blk.classList.contains("col") ? blk.previousElementSibling : null;
    while (head && !head.classList.contains("rband")) head = head.previousElementSibling;
    var b = view.querySelector('.st[data-id="' + CSS.escape(id) + '"]');
    if (head && head.getBoundingClientRect().top < 0) head.scrollIntoView({ block: "start" });
    var r = b.getBoundingClientRect();
    if (r.top < 0 || r.bottom > window.innerHeight) b.scrollIntoView({ block: "nearest" });
  }
  function moveTo(id, crossed) {
    S.sel = id; paintSel(); focusStep(id);
    if (crossed) revealBlock(id);
  }
  document.addEventListener("keydown", function (e) {
    if (!R || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    var onLine = t && t.classList && t.classList.contains("st");
    if (!onLine && t && t !== document.body && t !== document.documentElement) return;
    var cur = onLine ? t.getAttribute("data-id") : S.sel;
    var n = cur && NODES[cur];
    if (n && n.ti != null) S.lastCol = n.ti;
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && n && n.ti != null && R.targets.length > 1) {
      e.preventDefault();
      var N = R.targets.length, tj = (n.ti + (e.key === "ArrowRight" ? 1 : N - 1)) % N;
      var c = counterpart(cur, tj);
      var crossed = false;
      if (!c) {
        // no matching line: land on the first line of the next step that target has lines for
        var cols = Array.prototype.slice.call(view.querySelectorAll('.col[data-col="' + tj + '"]'));
        var at = cols.map(function (x) { return x.getAttribute("data-root"); }).indexOf(n.root.label);
        for (var k = at + 1; k < cols.length && !c; k++) {
          var first = cols[k].querySelector(".st:not([disabled])");
          c = first && first.getAttribute("data-id");
        }
        crossed = !!c;
      }
      if (c) moveTo(c, crossed);
      return;
    }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    var ti = n && n.ti != null ? n.ti : S.lastCol || 0;
    var list = walkList(ti);
    if (!list.length) return;
    e.preventDefault();
    var i = list.indexOf(cur), j = i < 0 ? 0 : e.key === "ArrowDown" ? Math.min(i + 1, list.length - 1) : Math.max(i - 1, 0);
    if (j === i) return;
    moveTo(list[j], i >= 0 && blockOf(list[j]) !== blockOf(cur));
  });

  // ---------- loading ----------
  function load(text, name, openIds) {
    try {
      build(text, name);
      (openIds || []).forEach(function (id) { if (NODES[id]) S.open[id] = {}; });
      render(); setHash();
    } catch (err) {
      view.innerHTML = '<p class="err">Could not read ' + esc(name) + ": " + esc(err.message) + "</p>";
      console.warn(err);
    }
  }
  function fromHash() {
    var q = (location.hash.split("?")[1] || ""), P = {};
    q.split("&").forEach(function (kv) { if (!kv) return; var p = kv.split("="); P[p[0]] = decodeURIComponent(p[1] || ""); });
    return P;
  }
  // The report text is embedded as a JSON string, so no character in it can end the script.
  document.getElementById("theme").onclick = function () {
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  };
  var P0 = fromHash();
  load(JSON.parse(document.getElementById("pd-report").textContent), document.title, (P0.open || "").split(",").filter(Boolean));

  // ---------- explanation ----------
  // A page may carry an explanation of its failure in a pd-explanation tag, written from the
  // page's bundle. Such a page opens on an Explanation tab next to the Run tab. Each
  // citation resolves through the bundle's ids and maps, never through the page text, to the
  // element the Run view rendered for it. A page without the tag runs none of this.
  var XTAG = document.getElementById("pd-explanation");
  if (XTAG) explain(XTAG);

  function explain(tag) {
    var X, bundle = {};
    try { X = JSON.parse(tag.textContent).explanation; } catch (err) { console.warn(err); return; }
    if (!X || typeof X !== "object") return;
    try { bundle = JSON.parse(document.getElementById("pd-bundle").textContent) || {}; } catch (err) { console.warn(err); }
    var IDS = Object.create(null);
    list(bundle.ids).forEach(function (id) { if (typeof id === "string") IDS[id] = true; });
    var bar = document.createElement("div"), pane = document.createElement("section"), cur = null, scrollAt = { explanation: 0, run: 0 };
    bar.id = "pd-tabs"; bar.className = "xtabs"; bar.setAttribute("role", "tablist");
    bar.innerHTML = '<button type="button" role="tab" data-view="explanation">Explanation</button><button type="button" role="tab" data-view="run">Run</button>';
    pane.id = "pd-explanation-view"; pane.className = "xpane"; pane.setAttribute("role", "tabpanel");
    pane.innerHTML = '<p class="xlead">Hypotheses ranked by a language model from this run; each claim links to its evidence.</p>' +
      "<h2>Summary</h2>" + list(X.summary).map(claim).join("") +
      "<h2>Hypotheses</h2>" + list(X.hypotheses).map(function (y) {
        y = y || {};
        return '<div class="xhyp"><h3>Hypothesis ' + esc(y.rank) + " (" + esc(y.likelihood) + ")</h3><p>" + esc(y.claim) + "</p>" +
          '<div class="xlbl">Evidence</div>' + cites(y.evidence) +
          '<div class="xlbl">Next steps</div><ul>' + list(y.next_steps).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>";
      }).join("") +
      "<h2>Talking points</h2>" + list(X.talking_points).map(claim).join("");
    view.parentNode.insertBefore(bar, view);
    view.parentNode.insertBefore(pane, view);
    bar.addEventListener("click", function (e) { var b = e.target.closest("[data-view]"); if (b) show(b.getAttribute("data-view")); });
    pane.addEventListener("click", function (e) {
      var b = e.target.closest("[data-ref]");
      if (!b) return;
      var id = b.getAttribute("data-ref");
      if (b.classList.contains("xsrc")) toggleSource(b, id);
      else cite(id);
    });
    // The Run view's arrow keys walk its lines; on the Explanation tab they scroll the page.
    window.addEventListener("keydown", function (e) { if (cur === "explanation" && /^Arrow/.test(e.key)) e.stopPropagation(); }, true);
    show("explanation");

    function list(x) { return Array.isArray(x) ? x : []; }
    function claim(c) { c = c || {}; return '<div class="xitem"><p>' + esc(c.text) + "</p>" + cites(c.cites) + "</div>"; }
    function cites(ids) {
      return '<div class="xcites">' + list(ids).map(function (id) {
        id = String(id);
        if (/^source:/.test(id) ? sourceOf(id) : IDS[id] && locate(id))
          return '<button type="button" class="xcite' + (/^source:/.test(id) ? ' xsrc" aria-expanded="false" title="show the cited lines"' : '" title="show in the run"') + ' data-ref="' + esc(id) + '">' + esc(id) + "</button>";
        return '<span class="xcite xnone" data-ref-none="' + esc(id) + '">' + esc(id) + " (not in this page)</span>";
      }).join("") + "</div>";
    }
    function show(v) {
      if (v === cur) return;
      if (cur) scrollAt[cur] = window.scrollY;
      cur = v;
      pane.style.display = v === "explanation" ? "" : "none";
      view.style.display = v === "run" ? "" : "none";
      bar.querySelectorAll("[data-view]").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-view") === v)); });
      window.scrollTo(0, scrollAt[v]);
    }

    // A function id reads its lines from the function's from/to; a range id
    // source:<Module>:<from>-<to> is split at its last colon and bounded by the module's lines.
    function sourceOf(id) {
      var hit = null;
      if (IDS[id]) list(bundle.modules).forEach(function (m) { list(m && m.functions).forEach(function (f) { if (!hit && f && f.id === id) hit = { m: m, from: f.from, to: f.to }; }); });
      if (!hit) {
        var rest = id.slice("source:".length), at = rest.lastIndexOf(":"), r = /^([0-9]+)-([0-9]+)$/.exec(rest.slice(at + 1));
        if (at <= 0 || !r) return null;
        list(bundle.modules).forEach(function (m) { if (!hit && m && m.module === rest.slice(0, at)) hit = { m: m, from: +r[1], to: +r[2] }; });
        if (!hit || !(typeof hit.m.lines === "number" && hit.to <= hit.m.lines)) return null;
      }
      if (typeof hit.m.source !== "string" || typeof hit.from !== "number" || typeof hit.to !== "number" || !(hit.from >= 1 && hit.from <= hit.to)) return null;
      var lines = hit.m.source.split("\n");
      return hit.to <= lines.length ? { from: hit.from, to: hit.to, lines: lines } : null;
    }
    function toggleSource(b, id) {
      var next = b.nextElementSibling;
      if (next && next.classList.contains("xcode")) { next.parentNode.removeChild(next); b.setAttribute("aria-expanded", "false"); return; }
      var s = sourceOf(id), h = "";
      if (!s) return;
      for (var k = s.from; k <= s.to; k++) h += '<div class="xl"><span class="xn">' + k + '</span><span class="xt">' + esc(s.lines[k - 1].replace(/\r$/, "")) + "</span></div>";
      var blk = document.createElement("div");
      blk.className = "xcode"; blk.setAttribute("data-src-of", id); blk.innerHTML = h;
      b.parentNode.insertBefore(blk, b.nextSibling);
      b.setAttribute("aria-expanded", "true");
    }

    function indexById(xs, id) { for (var i = 0; i < xs.length; i++) if (xs[i] && xs[i].id === id) return i; return -1; }
    // The element the Run view rendered for an id: {open, el}, where open() unfolds what hides it
    // and el() finds it; null when the view rendered nothing for it.
    function locate(id) {
      if (!R || !R.targets) return null;
      var fields = list(bundle.failure && bundle.failure.fields), fi = indexById(fields, id);
      if (fi >= 0) {
        // the viewer's own reading of the Failure section must line up with the bundle's fields
        if (R.failure.length !== fields.length || R.failure[fi].k !== fields[fi].label) return null;
        return { el: function () { return view.querySelectorAll(":scope > .facts > .v")[fi] || null; } };
      }
      if (indexById(list(bundle.context), id) >= 0) return R.checks == null ? null : { el: function () { return sec(0); } };
      var secs = list(bundle.sections), si = indexById(secs, id);
      if (si >= 0) return section(String(secs[si].title), secs.slice(0, si));
      var L = list(bundle.listing);
      for (var ti = 0; ti < L.length; ti++) {
        var steps = list(L[ti] && L[ti].steps);
        for (var k = 0; k < steps.length; k++) {
          var ei = steps[k] ? indexById(list(steps[k].entries), id) : -1;
          if (steps[k] && (steps[k].id === id || ei >= 0)) return step(L, ti, steps[k], ei >= 0 ? steps[k].entries[ei] : null);
        }
      }
      return null;
    }
    // The top-level sections of the Run view, in order: What this checks, the projections, the
    // other sections, Reproduction. The k-th one, opened.
    function sec(k) {
      var d = view.querySelectorAll(":scope > details.sec")[k];
      if (d) d.open = true;
      return d || null;
    }
    function section(title, before) {
      var first = R.checks != null ? 1 : 0, proj = R.projection ? 1 : 0;
      if (title === "Failure") return { el: function () { return view.querySelector(":scope > .facts"); } };
      if (title === "What this checks") return R.checks == null ? null : { el: function () { return sec(0); } };
      if (title === R.reproTitle) return { el: function () { return view.querySelector(":scope > .rgrid"); } };
      if (title === "Setup") return R.setup ? { el: function () { return view.querySelector(".setupbox"); } } : null;
      if (R.projection && title === R.projection.title) return { el: function () { return sec(first); } };
      if (title === "Reproduction") return R.reproduction ? { el: function () { return sec(first + proj + R.other.length); } } : null;
      var nth = before.filter(function (s) { return s && String(s.title) === title; }).length, seen = -1, at = -1;
      R.other.forEach(function (o, j) { if (o.title === title && ++seen === nth) at = j; });
      return at < 0 ? null : { el: function () { return sec(first + proj + at); } };
    }
    // A step or an entry of the listing's target ti. One target maps to the view's single target
    // whatever its name; several must name the view's targets in order.
    function step(L, ti, st, entry) {
      var xti = L.length === 1 && R.targets.length === 1 ? 0 : L.length === R.targets.length && L[ti].name === R.targets[ti].name ? ti : -1;
      var lm = /^\[(.*)\]$/.exec(String(st.label)), root = null, x = null;
      if (xti < 0 || !lm) return null;
      R.targets[xti].steps.forEach(function (r) {
        if (x || r.pseudo) return;
        if (r.label === lm[1]) { root = r; x = r; return; }
        r.children.forEach(function (c) { if (!x && c.label === lm[1]) { root = r; x = c; } });
      });
      if (!x) return null;
      function col() { return view.querySelector('.col[data-col="' + xti + '"][data-root="' + CSS.escape(root.label) + '"]'); }
      var ex = root.execs.indexOf(x);
      if (!entry) return { el: x === root ? col : function () { var c = col(); return c && ex >= 0 ? c.querySelectorAll(":scope > .ebox")[ex] || null : null; } };
      // n counts the step's events from 1; log lines are not entries, and events never collate.
      // Events tied to no command print after the target's last step, so the Run view lists them
      // in that step's box; the bundle counts them apart, in the target's untied count.
      var steps = list(L[ti].steps), untied = L[ti].untied, extra = st === steps[steps.length - 1] && untied && typeof untied.count === "number" ? untied.count : 0;
      var events = ex < 0 ? [] : x.entries.filter(function (e) { return e.kind === "event"; });
      var e = events.length === list(st.entries).length + extra ? events[entry.n - 1] : null;
      var item = e && x.items.filter(function (i) { return NODES[i].item.entries[0] === e; })[0];
      if (!item) return null;
      return {
        open: function () { if (S.tags[e.tag] === false) S.tags[e.tag] = true; openStep(item); },
        el: function () { return view.querySelector('.st[data-id="' + CSS.escape(item) + '"]'); }
      };
    }
    // Shows the cited element in the Run view: unfolds it, scrolls to it and marks it. One
    // element carries data-cite at a time.
    function cite(id) {
      var loc = locate(id);
      if (!loc) return;
      show("run");
      if (loc.open) loc.open();
      document.querySelectorAll("[data-cite]").forEach(function (m) { m.removeAttribute("data-cite"); m.classList.remove("xhl"); });
      var el = loc.el();
      if (!el) return;
      el.setAttribute("data-cite", id);
      el.classList.add("xhl");
      el.scrollIntoView({ block: el.getBoundingClientRect().height > window.innerHeight ? "start" : "center" });
    }
  }
})();
</script>
</body>
</html>
